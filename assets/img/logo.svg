<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Mr. LOLO">
  <title>Mr. LOLO</title>
  <defs>
    <linearGradient id="ll-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEE55"/>
      <stop offset="1" stop-color="#FFD400"/>
    </linearGradient>
    <linearGradient id="ll-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8E6"/>
      <stop offset="1" stop-color="#FFEBC2"/>
    </linearGradient>
    <linearGradient id="ll-tie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33C6F5"/>
      <stop offset="1" stop-color="#0090C8"/>
    </linearGradient>
    <clipPath id="ll-round"><rect width="120" height="120" rx="27"/></clipPath>
  </defs>

  <g clip-path="url(#ll-round)">
    <rect width="120" height="120" fill="url(#ll-bg)"/>
    <path d="M0 96 Q60 82 120 100 V120 H0 Z" fill="#FFC400" opacity=".55"/>
    <circle cx="22" cy="18" r="26" fill="#FFFFFF" opacity=".18"/>

    <!-- Moño -->
    <path d="M60 105 L33 93.5 v23 z" fill="url(#ll-tie)"/>
    <path d="M60 105 L87 93.5 v23 z" fill="url(#ll-tie)"/>
    <path d="M33 93.5 L52 100.5 v9 L33 116.5 z" fill="#FFFFFF" opacity=".28"/>
    <circle cx="60" cy="105" r="5.4" fill="#00699B"/>

    <!-- Cara -->
    <circle cx="60" cy="72" r="29" fill="url(#ll-face)" stroke="#14141A" stroke-width="3.4"/>
    <circle cx="40" cy="81" r="5.2" fill="#FF8FA3" opacity=".72"/>
    <circle cx="80" cy="81" r="5.2" fill="#FF8FA3" opacity=".72"/>

    <!-- Ojos -->
    <ellipse cx="48" cy="68" rx="3.7" ry="4.7" fill="#14141A"/>
    <circle cx="49.4" cy="66.2" r="1.35" fill="#FFFFFF"/>
    <ellipse cx="72" cy="68" rx="3.7" ry="4.7" fill="#14141A"/>
    <circle cx="73.4" cy="66.2" r="1.35" fill="#FFFFFF"/>

    <!-- Monóculo -->
    <circle cx="72" cy="68" r="9.2" fill="none" stroke="#E0A800" stroke-width="2.5"/>
    <path d="M80.5 70.5 q7.5 8 2.5 16" fill="none" stroke="#E0A800" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Bigote -->
    <path d="M60 86.5 c-5.2 -5.4 -15.2 -4.4 -18.4 1.1 c3.2 5.4 13.2 5.4 18.4 0 c5.2 5.4 15.2 5.4 18.4 0 c-3.2 -5.5 -13.2 -6.5 -18.4 -1.1 z" fill="#14141A"/>

    <!-- Sonrisa -->
    <path d="M53 94.5 q7 5.2 14 0" fill="none" stroke="#14141A" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Galera -->
    <g>
      <rect x="38" y="35" width="44" height="7.5" fill="#E8452C"/>
      <rect x="38" y="15" width="44" height="24" rx="5" fill="#14141A"/>
      <rect x="43.5" y="18.5" width="5" height="12" rx="2.5" fill="#FFFFFF" opacity=".22"/>
      <rect x="23" y="42.5" width="74" height="8.5" rx="4.2" fill="#14141A"/>
    </g>

    <!-- Destellos -->
    <path d="M99 22 l2.1 5.4 5.4 2.1 -5.4 2.1 -2.1 5.4 -2.1 -5.4 -5.4 -2.1 5.4 -2.1 z" fill="#FFFFFF" opacity=".9"/>
    <path d="M18 30 l1.5 3.8 3.8 1.5 -3.8 1.5 -1.5 3.8 -1.5 -3.8 -3.8 -1.5 3.8 -1.5 z" fill="#FFFFFF" opacity=".7"/>
  </g>
</svg>
